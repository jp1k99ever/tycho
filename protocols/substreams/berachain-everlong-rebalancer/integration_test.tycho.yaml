substreams_yaml_path: ./berachain-everlong-rebalancer.yaml
# Native integration — no VM adapter contract; simulation is skipped until the
# everlong_rebalancer ProtocolSim lands in tycho-simulation.
# Balances are the backing ALM's Sync totals, not tokens held by the swapper —
# the swapper settles through a flash loan and holds nothing between txs.
skip_balance_check: true
protocol_type_names:
  - "everlong_rebalancer_pool"
protocol_system: "everlong_rebalancer"
tests:
  # Requires a Berachain archive node (chain id 80094) — the public RPC prunes
  # state after ~10k blocks and serves logs inconsistently.
  - name: test_venue_component_creation
    start_block: 24689570
    stop_block: 24689670
    skip_simulation: true # Native simulation not yet implemented
    expected_components:
      - id: "0x27775ec38e2b394738b73c0d25f63e20063df054"
        tokens:
          - "0x1ce0a25d13ce4d52071ae7e02cf1f6606f4c79d3" # NECT (stable)
          - "0x0555e30da8f98308edb960aa94c0db47230d2b9c" # WBTC (volatile)
        static_attributes:
          coll_rebalancer_math: "0x72489064be7b96c56b17b1627f089217b38ad292"
          leverage_ratio_wad: "0x062afbde1181c71c" # 444444444444444444
        creation_tx: "0x7183a5470c679130ace90fd5673df9ed78bb737ee3e61b7e49c1eee681f75b3c"
        skip_simulation: true
